<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าแรก</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
    
        body {
            background-color: #f8f9fa;
        }

        .banner {
            background: url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e') no-repeat center;
            background-size: cover;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .form-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-title {
            background: #0d6efd;
            color: white;
            padding: 10px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            font-weight: bold;
        }

        .btn-pink {
            background-color: #ff4da6;
            color: white;
            border: none;
        }

        .btn-pink:hover {
            background-color: #e60073;
        }

        .btn-orange {
            background-color: #ff8c00;
            color: white;
            border: none;
        }

        .btn-orange:hover {
            background-color: #e67300;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <!-- โลโก้ -->
        <a class="navbar-brand fw-bold" href="/">ICT12367 SPU</a>

        <!-- เมนูด้านขวา -->
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/">หน้าแรก</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/form/">ลงทะเบียน</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about/">เกี่ยวกับเรา</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="banner">
    ยินดีต้อนรับสู่เว็บไซต์ของรายวิชา ICT12367
</div>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="form-box">

                <div class="form-title">
                    แบบฟอร์มบันทึกข้อมูลประชากร
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">ชื่อประชากร</label>
                        <input type="text" name="name" class="form-control" placeholder="กรุณากรอกชื่อ-นามสกุล">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">อายุ</label>
                        <input type="number" name="age" class="form-control" placeholder="กรอกข้อมูลอายุเป็นตัวเลข">
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-pink me-2">ลงทะเบียน</button>
                        <button type="reset" class="btn btn-orange">ล้างข้อมูล</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

</div>

</body>
</html>

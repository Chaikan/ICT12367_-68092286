{% block content %}

<style>
.grid-container {
    display: grid;
    grid-template-columns: repeat(3, 150px);
    gap: 15px;
    justify-content: center;
}

.grid-item {
    width: 150px;
    height: 150px;
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    border: 2px solid #ddd;
}

.grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}

/* hover effect */
.grid-item:hover {
    transform: scale(1.1);
    box-shadow: 0 8px 15px rgba(0,0,0,0.3);
}

.grid-item:hover img {
    transform: scale(1.1);
}
</style>

<div class="container mt-5">

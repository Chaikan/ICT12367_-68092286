{% extends "base.html"%}
{% block title %}
<title>แบบฟอร์มบันทึกข้อมูลประชากร</title>
{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ฟอร์มลงทะเบียน</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .form-box {
            background: white;
            width: 300px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #28a745;
            color: white;
        }

        .reset-btn {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>ลงทะเบียน</h2>

        <form id="registerForm">
            <input type="text" id="name" placeholder="กรอกชื่อ" required>
            <input type="number" id="age" placeholder="กรอกอายุ" required>

            <br>
            <button type="submit" class="submit-btn">ลงทะเบียน</button>
            <button type="reset" class="reset-btn">ล้างข้อมูล</button>
        </form>

        <p id="result"></p>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event){
            event.preventDefault();

            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;

            document.getElementById("result").innerHTML =
                "ลงทะเบียนสำเร็จ!<br>ชื่อ: " + name + "<br>อายุ: " + age + " ปี";
        });
    </script>

</body>
</html>
{% endblock%}

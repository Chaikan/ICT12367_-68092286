<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}เว็บไซต์ของฉัน{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
margin:0;
font-family: Arial;
}

/* navbar */
.navbar{
background:#1f6fe5;
}

/* slider */
.carousel-item{
height:500px;
}

.carousel-item img{
height:500px;
object-fit:cover;
}

/* ข้อความกลางรูป */
.carousel-caption{
background:rgba(0,0,0,0.4);
padding:20px;
border-radius:10px;
}

/* footer */
footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">

<a class="navbar-brand fw-bold" href="/">Boonsiri Masan</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="/">หน้าแรก</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/about">เกี่ยวกับเรา</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/form">แบบฟอร์ม</a>
</li>

</ul>

</div>
</div>
</nav>


<!-- Slider -->
<div id="slider" class="carousel slide" data-bs-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://www.spu.ac.th/wp-content/uploads/2024/07/20200526124926.jpg" class="d-block w-100">
<div class="carousel-caption">
<h3>ยินดีต้อนรับสู่เว็บไซต์ของเรา</h3>
<p>SPU มหาลัยเผื่อทุกคน</p>
</div>
</div>

<div class="carousel-item">
<img src="https://www.spu.ac.th/newsupdate/wp-content/uploads/2024/06/20171130155703SE0I4zZ.jpg" class="d-block w-100">
</div>

<div class="carousel-item">
<img src="https://www.matichon.co.th/wp-content/uploads/2025/07/02-109.jpg" class="d-block w-100">
</div>

</div>

<button class="carousel-control-prev" type="button" data-bs-target="#slider" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" type="button" data-bs-target="#slider" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>


<!-- เนื้อหาแต่ละหน้า -->
<div class="container mt-4">
{% block content %}{% endblock %}
</div>


<!-- Footer -->
<footer>
<p>© 2025 เว็บไซต์ของคุณ. สงวนลิขสิทธิ์</p>
<p>ติดต่อ: chaikan.com | โทร: 06x-xxx-xxxx</p>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
